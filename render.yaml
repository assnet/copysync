# CopySync — Render Blueprint (parcial)
# Docs: https://render.com/docs/blueprint-spec
#
# O Render já detecta pnpm quando existe app/pnpm-lock.yaml.
# NÃO use `corepack enable` no build nativo — /usr/bin é read-only (EROFS).

services:
  - type: web
    name: waioprime
    runtime: static
    rootDir: app
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    # Painel privado (app.copysync.app): invisivel para buscadores.
    # X-Robots-Tag cobre TODA resposta (HTML, JS, CSS, imagens, manifest),
    # algo que a <meta name="robots"> do index.html sozinha nao alcanca.
    # Ver docs/app-bloqueio-indexacao.md.
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet, noimageindex
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
