# CopySync — Render Blueprint (parcial)
# Docs: https://render.com/docs/blueprint-spec
#
# O Render já detecta pnpm quando existe app/pnpm-lock.yaml.
# NÃO use `corepack enable` no build nativo — /usr/bin é read-only (EROFS).

services:
  - type: web
    name: copysync
    runtime: static
    rootDir: app
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    # Painel privado (app.copysync.app): invisivel para buscadores.
    # X-Robots-Tag cobre TODA resposta (HTML, JS, CSS, imagens, manifest),
    # algo que a <meta name="robots"> do index.html sozinha nao alcanca.
    # Ver docs/app-bloqueio-indexacao.md.
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet, noimageindex
      # CSP do painel. Precisa de:
      #  - style-src 'unsafe-inline': MUI/Emotion e o <style> do index.html (static site nao gera nonce)
      #  - connect-src/media-src api.copysync.app (+ wss): REST, SSE, WebSocket e midias do chat
      # Dominio errado aqui = login morto e layout quebrado. Ver docs/app-bloqueio-indexacao.md.
      # Servico no dashboard chama-se copysync_app; se este Blueprint nao estiver vinculado,
      # replicar os headers manualmente em Settings > Headers.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://api.copysync.app; font-src 'self' data:; connect-src 'self' https://api.copysync.app wss://api.copysync.app; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_EXTENSION_IDS
        sync: false
