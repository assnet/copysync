<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afiliado Inteligente</title>
  <style>
   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 350px;
  min-height: 400px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  background: white;
  padding: 0;
}

.container {
  background: white;
  padding: 24px;
}

.logo {
  text-align: center;
  margin-bottom: 20px;
  padding: 20px 0;
  background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
  margin: -24px -24px 20px -24px;
  border-radius: 0;
}

.logo img {
  max-width: 150px;
  height: auto;
  filter: brightness(0) invert(1);
}

.status {
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  text-align: center;
  font-weight: 500;
}

.status.success {
  background: #dbeafe;
  color: #1e40af;
  border: 1px solid #93c5fd;
}

.status.error {
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #fca5a5;
}

.status.warning {
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #fde68a;
}

.form-group {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.3s;
}

input:focus {
  outline: none;
  border-color: #2563eb;
}

input::placeholder {
  color: #94a3b8;
}

button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.helper-text {
  font-size: 12px;
  color: #64748b;
  margin-top: 4px;
}

.loading {
  display: none;
  text-align: center;
  padding: 10px;
}

.loading.active {
  display: block;
}

.spinner {
  border: 3px solid #e2e8f0;
  border-top: 3px solid #2563eb;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="Redirect Flow">
    </div>
    
    <div id="statusMessage" class="status warning">
      Faça login no Mercado Livre primeiro
    </div>
    
    <form id="tokenForm">
      <div class="form-group">
        <label for="userEmail">E-mail</label>
        <input 
          type="email" 
          id="userEmail" 
          placeholder="seu@email.com"
        >
      </div>
      
      <div class="form-group">
        <label for="etiqueta">Etiqueta do Mercado Livre *</label>
        <input 
          type="text" 
          id="etiqueta" 
          placeholder="Ex: jc20240625231012" 
          required
        >
        <div class="helper-text">Cole sua etiqueta de afiliado aqui</div>
      </div>
      
      <button type="submit" id="submitBtn">
        Conectar
      </button>
    </form>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 10px; color: #667eea; font-weight: 500;">Salvando...</p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
