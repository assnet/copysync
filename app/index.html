<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Painel privado: nenhum buscador deve indexar, seguir links, arquivar,
      exibir snippet ou indexar imagens. Reforcado por /robots.txt e pelo
      header X-Robots-Tag (render.yaml). Ver docs/app-bloqueio-indexacao.md.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Cor da barra do navegador acompanhando o tema do painel -->
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <title>CopySync</title>
    <!--
      data-app="copysync" — marcador de whitelist do DomGuardian.
      Garante que este <style> nunca seja removido pelo guardian.
      isolation: isolate — cria stacking context próprio para o #root,
      impedindo que z-index de widgets externos interfiram no layout.
    -->
    <style data-app="copysync">
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      /* Remove o atraso de ~300ms do toque e evita zoom por duplo toque */
      html { touch-action: manipulation; }
      /* Elementos nativos (scrollbars, inputs) acompanham o tema do sistema */
      :root { color-scheme: light dark; }
      /* Sem animação para quem pediu menos movimento */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      #root {
        isolation: isolate;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
