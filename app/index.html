<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatPrime</title>
    <!--
      data-app="chatprime" — marcador de whitelist do DomGuardian.
      Garante que este <style> nunca seja removido pelo guardian.
      isolation: isolate — cria stacking context próprio para o #root,
      impedindo que z-index de widgets externos interfiram no layout.
    -->
    <style data-app="chatprime">
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      #root {
        isolation: isolate;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
