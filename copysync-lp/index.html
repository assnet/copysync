<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>CopySync · Rota Automática de Ofertas</title>
    <meta
      name="description"
      content="A Rota Automática de Ofertas da CopySync monitora os grupos que você escolhe, troca o link pelo seu link de afiliado e publica nos seus grupos."
    />
    <!-- Consent Mode do Google: tudo negado por padrão. GA4 e Google Ads só usam cookies depois do "Aceitar".
         A tag do Google (gtag.js) entra logo DEPOIS deste bloco. -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied', wait_for_update: 500 })
      try {
        var c = localStorage.getItem('cs-consent')
        if (c === 'granted' || c === 'denied') gtag('consent', 'update', { ad_storage: c, ad_user_data: c, ad_personalization: c, analytics_storage: c })
      } catch (e) {}
    </script>
    <!-- Tag do Google (gtag.js): GA4 + Google Ads (só a tag base; a compra é medida pelo checkout da Cakto).
         Segue o Consent Mode acima. O linker liga a sessão ao checkout em pay.cakto.com.br. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C0DJZKPX9S"></script>
    <script>
      gtag('js', new Date())
      gtag('set', 'linker', { domains: ['pay.cakto.com.br'] })
      gtag('config', 'G-C0DJZKPX9S')
      gtag('config', 'AW-18410182876')
    </script>
    <!-- Microsoft Clarity (zgmja8fnyk): só é baixado com consentimento, e sempre depois que a página terminou de carregar.
         Mesmo no "modo sem cookies" o download do Clarity já grava cookies da Microsoft (CLID, MUID…), por isso
         nada do Clarity é pedido antes do "Aceitar". Quem já aceitou: carrega após o "load". No "Aceitar": CookieBanner.tsx. -->
    <script>
      window.clarity = window.clarity || function () { (window.clarity.q = window.clarity.q || []).push(arguments) }
      window.csLoadClarity = function () {
        if (window.csClarityLoaded) return
        window.csClarityLoaded = true
        clarity('consentv2', { ad_Storage: 'granted', analytics_Storage: 'granted' })
        var t = document.createElement('script')
        t.async = true
        t.src = 'https://www.clarity.ms/tag/zgmja8fnyk'
        document.head.appendChild(t)
      }
      var ccOk = false
      try { ccOk = localStorage.getItem('cs-consent') === 'granted' } catch (e) {}
      if (ccOk)
        addEventListener('load', function () {
          if ('requestIdleCallback' in window) requestIdleCallback(window.csLoadClarity, { timeout: 3000 })
          else setTimeout(window.csLoadClarity, 1)
        })
    </script>
    <!-- Teste do borrão: só com ?borrao=1 na URL (sem o parâmetro, nada muda) -->
    <script>
      if (/[?&]borrao=1(&|$)/.test(location.search)) document.documentElement.classList.add('borrao')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
